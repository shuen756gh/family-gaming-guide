name: Refresh Roblox images

# Roblox CDN image links expire, so refresh them monthly.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/update_roblox_images.mjs
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roblox-images.json
          git commit -m "Refresh Roblox image URLs"
          git push
          # Pushes made with GITHUB_TOKEN may not start a Pages build, so request one explicitly.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
